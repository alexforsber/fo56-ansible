- name: Configure MariaDB for WordPress
  hosts: all
  become: true
  vars:
    wp_db_name: wordpress
    wp_db_user: wpuser
    # mariadb_root_password and wp_db_password come from the Semaphore environment
  module_defaults:
    community.mysql.mysql_user:
      login_user: root
      login_password: "{{ mariadb_root_password }}"
      login_unix_socket: /var/lib/mysql/mysql.sock
    community.mysql.mysql_db:
      login_user: root
      login_password: "{{ mariadb_root_password }}"
      login_unix_socket: /var/lib/mysql/mysql.sock
  tasks:
    - name: Install MariaDB server and pip
      ansible.builtin.dnf:
        name:
          - mariadb105-server
          - python3-pip
        state: present

    - name: Install PyMySQL (needed by the community.mysql modules)
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3
        state: present

    - name: Allow connections from the web subnet
      ansible.builtin.copy:
        dest: /etc/my.cnf.d/99-bind.cnf
        content: |
          [mysqld]
          bind-address = 0.0.0.0
      notify: Restart MariaDB

    - name: Start and enable MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Apply the bind-address change now
      ansible.builtin.meta: flush_handlers

    - name: Set the root password
      community.mysql.mysql_user:
        name: root
        host_all: true
        password: "{{ mariadb_root_password }}"
        state: present

    - name: Remove anonymous users
      community.mysql.mysql_user:
        name: ""
        host_all: true
        state: absent

    - name: Remove the test database
      community.mysql.mysql_db:
        name: test
        state: absent

    - name: Create the WordPress database
      community.mysql.mysql_db:
        name: "{{ wp_db_name }}"
        state: present

    - name: Create the WordPress user
      community.mysql.mysql_user:
        name: "{{ wp_db_user }}"
        password: "{{ wp_db_password }}"
        host: "10.56.3.%"
        priv: "{{ wp_db_name }}.*:ALL"
        state: present

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
